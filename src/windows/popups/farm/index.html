<div class="farm-app not_drag"><header><div><b>QQ 农场</b><span>农场钱包 {{wallet.wallet}} 元宝 · 桌面余额 {{wallet.outside}} 元宝</span></div><button @click="close">离开农场</button></header><p class="wallet-note">进入农场时，元宝放入农场钱包；离开时归还。期间从其他玩法获得的元宝会单独保留。</p><div id="farm-stage"></div><nav><button @click="action('plant')" :disabled="!ready">一键播种</button><button @click="action('care')" :disabled="!ready">一键照料</button><button @click="action('harvest')" :disabled="!ready">一键收获</button><button @click="action('clear')" :disabled="!ready">一键铲除</button></nav><footer role="status">{{message}}</footer></div>
